# =============================================================================
# 关卡 3 · 向量门禁
# =============================================================================
# 内容：黄金测试向量在三个平台上跑通，且**三个平台的判定完全一致**。
#
# 为什么这一关不能被关卡 2 取代：
#
#   关卡 2 跑的是单测，验证的是「代码逻辑自洽」。
#   关卡 3 跑的是向量，验证的是「字节级输出与我签入的契约一致」，
#   而且是在三个不同的平台、三个不同的 CPU 架构上。
#
#   本项目最可能出的跨平台事故，恰好都是字节级的：
#     - 浮点行为（虽然金额不用浮点，但任何一处漏用都会在这里暴露）
#     - 字节序处理（手写的 u16/u32/u64 读写是最容易写错的地方）
#     - 字符串 → 字节的编码（UTF-8 规范化在英文环境下"看起来也一样"）
#     - 换行符（CRLF 混进被哈希的载荷里）
#
#   只在一个平台上跑向量，等于把这四类事故的发现时间推迟到
#   「用户的备份文件在另一台机器上打不开」的那一刻。
#
# 一致性判定不看耗时、不看时间戳，只看「用例 ID + 状态」的摘要 ——
# 详见 tools/ci/compare_verdicts.py。
# =============================================================================
name: gate3-vectors

on:
  push:
    branches: [main, master]
    # 纯文档改动不触发本关卡（门禁策略，2026-09-15 加）。本关卡是 3 平台矩阵，
    #   而向量判定读的是 test_vectors/ 与 packages/ 下的文件，与 .md 无关。
    #   代价（明确接受）：若一次提交**只**动文档，本关卡不留下运行记录，
    #   「这次提交被门禁验过」对它不成立。代码与文档混在同一提交时照常触发。
    #   需要强制验证某次文档提交时，走 workflow_dispatch / 网页 Run workflow。
    #   注意：`pull_request` 同样被过滤 —— 若日后开了分支保护并把本关卡设为必需检查，
    #   纯文档 PR 会因「无检查项」而卡住，届时删掉下面 pull_request 段的过滤即可。
    #   `**.md` 匹配任意层级（GitHub 的 `**` 可跨 `/`），故根目录 README.md 也覆盖。
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: gate3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MELOS_VERSION: 6.3.2
  PUB_MAX_CONCURRENT_DOWNLOADS: "4"

jobs:
  golden-vectors:
    name: 黄金向量 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取 Flutter 版本
        id: flutter-version
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      # melos 的全局可执行目录三个平台不同（Unix：$HOME/.pub-cache/bin；
      # Windows：%LOCALAPPDATA%\Pub\Cache\bin）。写死前者会让 Windows 作业
      # 在下一步以 "melos: command not found" 失败。完整说明见 gate1-static.yml。
      - name: 安装 melos
        shell: bash
        run: |
          dart pub global activate melos "$MELOS_VERSION"

          if [ -n "${LOCALAPPDATA:-}" ] && command -v cygpath >/dev/null 2>&1; then
            PUB_BIN_POSIX="$(cygpath -u "$LOCALAPPDATA")/Pub/Cache/bin"
            PUB_BIN="$(cygpath -w "$PUB_BIN_POSIX")"
          else
            PUB_BIN_POSIX="$HOME/.pub-cache/bin"
            PUB_BIN="$PUB_BIN_POSIX"
          fi

          echo "$PUB_BIN" >> "$GITHUB_PATH"
          echo "melos 可执行目录：$PUB_BIN"
          ls -1 "$PUB_BIN_POSIX"

      # 用 flutter pub get 而不是 melos bootstrap：后者要自行判断
      # 「这是不是 Flutter 工作区」，判断错就退回 dart pub get，
      # pf_mobile 的 Flutter SDK 依赖会解析不到。
      - name: 解析工作区依赖
        run: flutter pub get

      # 退出码约定（见 packages/pf_testkit/bin/vector_report.dart）：
      #   0 = 全部通过且 pending 与基线一致
      #   1 = 有向量失败，或 pending 集合与基线不符
      #   2 = 向量文件 / 环境本身有问题
      # 三种都让这一步失败，但报告内容不同，排障方向因此明确。
      - name: 运行黄金向量
        run: melos run vectors

      # 失败时把「还剩多少未实现」打出来。
      # 它不影响结果，但让日志里同时有「现在覆盖到哪」这个信息 ——
      # 否则一个失败的门禁只能说明"有问题"，不能说明"进行到哪了"。
      - name: 列出尚未实现的向量（仅信息）
        if: always()
        run: melos run vectors:pending

      - name: 上传向量报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectors-report-${{ matrix.os }}-${{ github.sha }}
          path: build/vectors/report.json
          if-no-files-found: error
          retention-days: 30

  verdict-consistency:
    name: 跨平台判定一致性
    needs: [golden-vectors]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载三个平台的报告
        uses: actions/download-artifact@v4
        with:
          pattern: vectors-report-*
          path: reports

      - name: 比对判定摘要
        shell: bash
        run: python3 tools/ci/compare_verdicts.py reports

  # =============================================================================
  # 跨实现校验（单平台）
  # =============================================================================
  # 内容：把**同一个 .pfb 文件**分别交给 Dart 实现与 Python 独立实现，各自从头走到尾，
  # 把沿途四层产物（文件字节 / 压缩载荷 / 记录行 / 逐条清单）打成规范文本，
  # 两份文本必须**逐字节相同**。
  #
  # 为什么这一关不能被前面两处取代：
  #
  #   · `golden-vectors`（本工作流的另一个作业）核的是**加密原语的中间值** ——
  #     「AES-GCM 的密文对不对」「Argon2id 的密钥对不对」。它是逐函数的。
  #   · 本作业核的是**端到端产物** —— 同一个文件喂进去，两套实现解出来的东西
  #     从字节到语义全部一致。逐函数正确并不蕴含端到端一致：分块顺序、AAD 链、
  #     contentHash 的覆盖边界、行切分、JSON 的键序与转义，都是「每个函数都对、
  #     拼起来仍然可以不同」的地方。
  #
  # 为什么是**单平台**、不新建 gate4：
  #
  #   · 它验的是「两套实现是否一致」，与被测平台无关 —— 放进三平台矩阵只是把
  #     同一个结论重复三遍，代价却是三倍的 Flutter 安装与 pip 安装。
  #   · 它属于「容器与载荷的发布格式对不对」，与 gate3 的其它作业同源，
  #     因此落在这里而不另开一关：多一个关卡名不会多一条判据。
  #
  # 反例是**必须**的：正例只能证明「两套实现在这份文件上碰巧一致」，
  # 证明不了「这个比对真的在看内容」。翻转一个字节，两边都必须拒绝 ——
  # 而一边拒绝、一边放行，正是这个作业要拦下的最坏情形。
  # =============================================================================
  cross-impl:
    name: 跨实现 PFB 校验
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取 Flutter 版本
        id: flutter-version
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      # Python 版本**显式钉住**：requirements.txt 里的哈希是按产物（轮子）钉的，
      # 而轮子的标签含 Python 版本（cp312 / abi3）。不钉住版本时，
      # 镜像升级 Python 会让 pip 找不到匹配的哈希并以
      # "THESE PACKAGES DO NOT MATCH THE HASHES" 失败 —— 那条报错看起来像投毒，
      # 实际只是「换了个解释器」。钉住之后两类原因就分得开了。
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 解析工作区依赖
        run: flutter pub get

      # --require-hashes 是这个作业的门槛之一，不是顺手加的：
      # 另一套实现的依赖一旦浮动，「红/绿」的原因就不再是「我们改坏了什么」，
      # 而是「上游改了实现」。详细说明见 tools/ci/requirements.txt 的头部。
      - name: 安装 Python 依赖（钉死版本 + 哈希）
        run: python3 -m pip install --require-hashes -r tools/ci/requirements.txt

      # `.pfb` 在 tracked_paths 的 deny 名单上（它是用户数据），
      # 所以样本**不能**入库 —— 它在 CI 上从被向量锁死的 fixture 里现落，
      # 落到 build/（同样在 deny 名单上，因此不会被误提交）。
      - name: 从 fixture 落出样本（不碰密码学）
        run: >-
          python3 tools/ci/pfb_cross_check.py emit-fixture
          --sample sample-full --out-dir build/cross

      - name: Dart 侧产出四层报告
        run: >-
          dart run tools/pf_cli/bin/pf.dart info build/cross/sample-full.pfb
          --records --password-file build/cross/password.txt
          --out build/cross/sample-full.dart.txt

      - name: Python 侧产出四层报告，并与 fixture 的期望值逐项比对
        run: >-
          python3 tools/ci/pfb_cross_check.py check
          --file build/cross/sample-full.pfb
          --password-file build/cross/password.txt
          --expect build/cross/sample-full.expect.json
          --out build/cross/sample-full.py.txt

      # 这一条是本作业的判据本体。diff 的输出（左 Dart、右 Python）直接进日志：
      # 「第几层开始不同」是排查时唯一有用的第一条信息。
      - name: 两份报告必须逐字节相同
        shell: bash
        run: |
          if ! diff -u build/cross/sample-full.dart.txt build/cross/sample-full.py.txt; then
            echo "::error::两套实现的四层产物不一致（左 Dart / 右 Python，见上面的 diff）"
            exit 1
          fi
          echo "✓ 四层逐字节相同（$(wc -c < build/cross/sample-full.dart.txt) 字节）"

      # 反例：翻转第 60 字节。取这个偏移是有意的 —— 它在头 CRC 的覆盖范围
      # （0..43）之外、在 contentDigest 的覆盖范围（48..长度-32）之内，
      # 因此两边应当落到**同一个**结论：内容损坏，而不是结构损坏。
      # 两边返回的退出码必须都是 1；`2`（工具故障）会掩盖真正的失败。
      - name: 反例：翻转第 60 字节 ⇒ 两边都必须拒绝
        shell: bash
        run: |
          python3 tools/ci/pfb_cross_check.py tamper \
            --file build/cross/sample-full.pfb \
            --out build/cross/tampered.pfb \
            --offset 60

          set +e
          dart run tools/pf_cli/bin/pf.dart verify build/cross/tampered.pfb \
            --password-file build/cross/password.txt
          dart_code=$?
          set -e
          if [ "$dart_code" != "1" ]; then
            echo "::error::篡改的文件：pf verify 期望退出码 1（业务结论），实际 $dart_code"
            exit 1
          fi

          set +e
          python3 tools/ci/pfb_cross_check.py check \
            --file build/cross/tampered.pfb \
            --password-file build/cross/password.txt \
            --out build/cross/tampered.py.txt
          py_code=$?
          set -e
          if [ "$py_code" != "1" ]; then
            echo "::error::篡改的文件：pfb_cross_check.py 期望退出码 1（断言失败），实际 $py_code"
            exit 1
          fi

          echo "✓ 两边都拒绝（Dart=$dart_code，Python=$py_code）"

      # 四份产物一起上传：只看「绿了」无法回答「当时两份文本长什么样」。
      # 失败时也要上传（if: always()）—— 失败现场才是真正需要看它们的时刻。
      - name: 上传跨实现校验的产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-impl-${{ github.sha }}
          path: |
            build/cross/sample-full.pfb
            build/cross/sample-full.expect.json
            build/cross/sample-full.dart.txt
            build/cross/sample-full.py.txt
          if-no-files-found: error
          retention-days: 30
